[project]
name = "hibernus"
version = "0.0.1"
description = "The Hibernus training hook"
requires-python = ">=3.10"

[project.optional-dependencies]
train = ["torch", "numpy"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
