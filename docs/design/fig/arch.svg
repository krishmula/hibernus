<text x="40" y="958" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5F6368">Step 2: the training hook stops the loop before the next batch and writes the application checkpoint.</text>
<text x="40" y="977" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5F6368">Step 3: cuda-checkpoint moves GPU state into host memory, then CRIU writes the process snapshot.</text>
